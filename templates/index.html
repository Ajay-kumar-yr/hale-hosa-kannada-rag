<!DOCTYPE html>
<html lang="kn" translate="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">

    <title>Hale Kannada → Hosa Kannada</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: white;
            padding: 35px;
            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            height: 150px;

            padding: 15px;
            font-size: 18px;

            border: 1px solid #ccc;
            border-radius: 10px;

            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #555;
        }

        button {
            width: 100%;
            margin-top: 20px;

            padding: 14px;

            font-size: 18px;
            font-weight: bold;

            border: none;
            border-radius: 10px;

            cursor: pointer;

            background: #222;
            color: white;
        }

        button:hover {
            background: #444;
        }

        .result {
            margin-top: 30px;
            padding: 20px;

            background: #f1f3f5;
            border-radius: 10px;
        }

        .result h2 {
            margin-top: 0;
        }

        .translation {
            font-size: 24px;
            font-weight: bold;
            line-height: 1.6;
        }

        .error {
            margin-top: 20px;
            padding: 15px;

            background: #ffe5e5;
            color: #b00020;

            border-radius: 8px;
        }

    </style>
</head>


<body translate="no" class="notranslate">

    <div class="container">

        <h1>ಹಳೆಗನ್ನಡ → ಹೊಸಗನ್ನಡ</h1>

        <div class="subtitle">
            Hale Kannada → Hosa Kannada Translation
        </div>


        <form method="POST">

            <label for="hale_text">
                Enter Hale Kannada
            </label>

            <textarea
                id="hale_text"
                name="hale_text"
                placeholder="ಇಲ್ಲಿ ಹಳೆಗನ್ನಡ ಪದ ಅಥವಾ ವಾಕ್ಯವನ್ನು ನಮೂದಿಸಿ..."
                required
            >{{ hale_text }}</textarea>


            <button type="submit">
                Translate
            </button>

        </form>


        {% if translation %}

        <div class="result">

            <h2>Hosa Kannada</h2>

            <div class="translation notranslate" translate="no">
                {{ translation }}
            </div>

        </div>

        {% endif %}


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}

    </div>

</body>

</html>
